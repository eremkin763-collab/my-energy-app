name: Build Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Create pubspec
        run: |
          echo "name: energy_app" > pubspec.yaml
          echo "environment:" >> pubspec.yaml
          echo "  sdk: '>=3.0.0 <4.0.0'" >> pubspec.yaml
          echo "dependencies:" >> pubspec.yaml
          echo "  flutter:" >> pubspec.yaml
          echo "    sdk: flutter" >> pubspec.yaml
          echo "  shared_preferences: ^2.2.0" >> pubspec.yaml
          echo "flutter:" >> pubspec.yaml
          echo "  uses-material-design: true" >> pubspec.yaml
      - name: Install Dependencies
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release --no-analytics
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: energy_meter_apk
          path: build/app/outputs/flutter-apk/app-release.apk
